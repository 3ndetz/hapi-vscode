name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: xvfb-run -a npm run test:host
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: isolated-editor-test-logs
          path: .local/host-test-*/user/logs/**/*.log
          retention-days: 3
